name: gymdesk
description: GymDesk - offline-first gym manager for a single gym owner (Android).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  rxdart: ^0.28.0

  # Database (local SQLite, no cloud)
  drift: ^2.22.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.26

  # Utils / formatting
  intl: ^0.20.2
  crypto: ^3.0.6
  google_fonts: ^6.2.1

  # Platform features (all free/local)
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.5
  share_plus: 13.3.1
  local_auth: ^2.3.0
  shared_preferences: ^2.3.4

  # Later phases (declared now so pub resolves once)
  excel: ^4.0.6
  pdf: ^3.11.1
  printing: ^5.13.4
  fl_chart: ^0.69.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  archive: ^3.6.1
  file_picker: 13.3.3
  material_ui: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  drift_dev: ^2.22.0

flutter:
  uses-material-design: true
